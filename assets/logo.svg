<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="100%">
  <defs>
    <radialGradient id="hGlow" cx="125" cy="125" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="hHelixA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="hHelixB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="hSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem Background -->
  <g transform="translate(15, 15)">
    <!-- Base -->
    <rect width="220" height="220" rx="55" fill="url(#hGlow)" stroke="#1e293b" stroke-width="2" />
    
    <!-- Outer Hex Ring -->
    <polygon points="110,25 188,70 188,150 110,195 32,150 32,70" 
             fill="none" stroke="url(#brandGrad)" stroke-width="2.5" stroke-linejoin="round" opacity="0.8" filter="url(#hSoftGlow)" />
    
    <!-- Hex Nodes -->
    <circle cx="110" cy="25" r="3.5" fill="#00f2fe" />
    <circle cx="188" cy="70" r="3.5" fill="#818cf8" />
    <circle cx="188" cy="150" r="3.5" fill="#c084fc" />
    <circle cx="110" cy="195" r="3.5" fill="#f43f5e" />
    <circle cx="32" cy="150" r="3.5" fill="#818cf8" />
    <circle cx="32" cy="70" r="3.5" fill="#00f2fe" />

    <!-- Center DNA Strands -->
    <g opacity="0.7" stroke-width="2">
      <line x1="85" y1="65" x2="135" y2="65" stroke="#38bdf8" stroke-dasharray="2 2" />
      <circle cx="85" cy="65" r="3" fill="#00f2fe" />
      <circle cx="135" cy="65" r="3" fill="#f43f5e" />

      <line x1="72" y1="90" x2="148" y2="90" stroke="#60a5fa" stroke-dasharray="2 2" />
      <circle cx="72" cy="90" r="3" fill="#00f2fe" />
      <circle cx="148" cy="90" r="3" fill="#fb7185" />

      <line x1="80" y1="110" x2="140" y2="110" stroke="#818cf8" stroke-dasharray="2 2" />
      <circle cx="110" cy="110" r="4" fill="#ffffff" filter="url(#hSoftGlow)" />

      <line x1="148" y1="130" x2="72" y2="130" stroke="#818cf8" stroke-dasharray="2 2" />
      <circle cx="148" cy="130" r="3" fill="#00f2fe" />
      <circle cx="72" cy="130" r="3" fill="#f43f5e" />

      <line x1="135" y1="155" x2="85" y2="155" stroke="#38bdf8" stroke-dasharray="2 2" />
      <circle cx="135" cy="155" r="3" fill="#00f2fe" />
      <circle cx="85" cy="155" r="3" fill="#f43f5e" />
    </g>

    <!-- Sine Wave Strands -->
    <path d="M 85,65 C 50,90 50,110 110,110 C 170,110 170,130 135,155" 
          fill="none" stroke="url(#hHelixA)" stroke-width="5" stroke-linecap="round" filter="url(#hSoftGlow)" />
    <path d="M 135,65 C 170,90 170,110 110,110 C 50,110 50,130 85,155" 
          fill="none" stroke="url(#hHelixB)" stroke-width="5" stroke-linecap="round" filter="url(#hSoftGlow)" />
  </g>

  <!-- Typography Right Section -->
  <g transform="translate(265, 0)">
    <!-- Main Title -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="52" fill="url(#textGrad)" letter-spacing="-0.5">
      Suleiman<tspan fill="url(#brandGrad)">Bioinformatics</tspan>
    </text>

    <!-- Tagline / Subtitle -->
    <text x="5" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="3.5">
      COMPUTATIONAL BIOLOGY &amp; GENOMIC INTELLIGENCE
    </text>

    <!-- Decorative Status Bar -->
    <g transform="translate(5, 178)">
      <rect x="0" y="0" width="70" height="4" rx="2" fill="#00f2fe" />
      <rect x="78" y="0" width="24" height="4" rx="2" fill="#818cf8" />
      <rect x="110" y="0" width="12" height="4" rx="2" fill="#f43f5e" />
      <text x="135" y="6" font-family="monospace" font-size="12" fill="#64748b" letter-spacing="1.5">
        RESEARCH · DATA · CURRICULA · BIOPHYSICS
      </text>
    </g>
  </g>
</svg>
